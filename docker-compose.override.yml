# SSOT Phase 002 §9 — local dev overrides (base = production-shaped cluster)
services:
  postgres:
    restart: "no"
    ports:
      - "5432:5432"
  # Redis Cluster is internal-only: every node advertises its 172.28.0.x
  # address, which a host client cannot reach. Use `docker compose exec`
  # for manual inspection. (Windows also excludes host port 6379.)
  redis-node-1: {}
