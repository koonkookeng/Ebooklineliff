# SSOT Phase 130 BDD-1 — edge service + ingress (100ms blue->green cutover)
# Canonical: apps/backend/src/infra/k8s/backend-service-ingress.yaml
# (legacy src/infra/k8s/*)
# - Cutover = flip service selector slot blue->green (single atomic apply);
#   LIFF sessions persist because entitlement/session state lives in Redis,
#   not in pods (no re-auth, no RAM spike — BDD-1).
apiVersion: v1
kind: Service
metadata:
  name: api-live
spec:
  selector:
    app: omnichannel-api
    slot: green
  ports:
    - port: 80
      targetPort: 4000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omnichannel-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.omnichannel.com
      secretName: omnichannel-tls
  rules:
    - host: api.omnichannel.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-live
                port:
                  number: 80
