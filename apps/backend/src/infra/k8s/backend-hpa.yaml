# SSOT Phase 130 §5.1 — autoscaling 10-50 pods (flash-sale bursts)
# Canonical: apps/backend/src/infra/k8s/backend-hpa.yaml
# (legacy src/infra/k8s/*)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-green-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-green
  minReplicas: 10
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 5
          periodSeconds: 60
    scaleDown:
      # Flash-sale traffic decays slower than CPU: hold capacity for 5m to
      # avoid flapping and cold-start storms during the cutover window.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
