networks:
  omni-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_node1_data: {}
  redis_node2_data: {}
  redis_node3_data: {}
  redis_node4_data: {}
  redis_node5_data: {}
  redis_node6_data: {}

services:
  # -----------------------------------------------------------------
  # Primary Database: PostgreSQL 16 with pgvector Extension
  # -----------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: omni-postgres-16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omni_db}
      POSTGRES_USER: ${POSTGRES_USER:-omni_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecurePass144XZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/backend/src/infra/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./apps/backend/src/infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    ports:
      - "5432:5432"
    networks:
      omni-network:
        ipv4_address: 172.28.0.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omni_admin} -d ${POSTGRES_DB:-omni_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c listen_addresses='*'

  # -----------------------------------------------------------------
  # Redis 7.2 Cluster Setup (3 Masters, 3 Replicas)
  # -----------------------------------------------------------------
  redis-node-1:
    image: redis:7.2-alpine
    container_name: omni-redis-1
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass ${REDIS_PASSWORD:-RedisSecure144XZ} --masterauth ${REDIS_PASSWORD:-RedisSecure144XZ} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_node1_data:/data
    networks:
      omni-network:
        ipv4_address: 172.28.0.11
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisSecure144XZ}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-node-2:
    image: redis:7.2-alpine
    container_name: omni-redis-2
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass ${REDIS_PASSWORD:-RedisSecure144XZ} --masterauth ${REDIS_PASSWORD:-RedisSecure144XZ} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_node2_data:/data
    networks:
      omni-network:
        ipv4_address: 172.28.0.12

  redis-node-3:
    image: redis:7.2-alpine
    container_name: omni-redis-3
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass ${REDIS_PASSWORD:-RedisSecure144XZ} --masterauth ${REDIS_PASSWORD:-RedisSecure144XZ} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_node3_data:/data
    networks:
      omni-network:
        ipv4_address: 172.28.0.13

  redis-node-4:
    image: redis:7.2-alpine
    container_name: omni-redis-4
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass ${REDIS_PASSWORD:-RedisSecure144XZ} --masterauth ${REDIS_PASSWORD:-RedisSecure144XZ} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_node4_data:/data
    networks:
      omni-network:
        ipv4_address: 172.28.0.14

  redis-node-5:
    image: redis:7.2-alpine
    container_name: omni-redis-5
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass ${REDIS_PASSWORD:-RedisSecure144XZ} --masterauth ${REDIS_PASSWORD:-RedisSecure144XZ} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_node5_data:/data
    networks:
      omni-network:
        ipv4_address: 172.28.0.15

  redis-node-6:
    image: redis:7.2-alpine
    container_name: omni-redis-6
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass ${REDIS_PASSWORD:-RedisSecure144XZ} --masterauth ${REDIS_PASSWORD:-RedisSecure144XZ} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_node6_data:/data
    networks:
      omni-network:
        ipv4_address: 172.28.0.16

  # Automated Cluster Creator Service
  redis-cluster-init:
    image: redis:7.2-alpine
    container_name: omni-redis-cluster-init
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
      - redis-node-4
      - redis-node-5
      - redis-node-6
    networks:
      - omni-network
    command: >
      sh -c "sleep 5 &&
      echo 'yes' | redis-cli -a ${REDIS_PASSWORD:-RedisSecure144XZ} --cluster create 172.28.0.11:6379 172.28.0.12:6379 172.28.0.13:6379 172.28.0.14:6379 172.28.0.15:6379 172.28.0.16:6379 --cluster-replicas 1"

  # -----------------------------------------------------------------
  # Backend NestJS Fastify Service
  # -----------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: omni-backend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-omni_admin}:${POSTGRES_PASSWORD:-SecurePass144XZ}@postgres:5432/${POSTGRES_DB:-omni_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-RedisSecure144XZ}@172.28.0.11:6379
      # RedisClusterService reads these directly (password + seed nodes).
      REDIS_PASSWORD: ${REDIS_PASSWORD:-RedisSecure144XZ}
      REDIS_CLUSTER_NODES: 172.28.0.11:6379,172.28.0.12:6379,172.28.0.13:6379,172.28.0.14:6379,172.28.0.15:6379,172.28.0.16:6379
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-for-local-dev-12345}
      # LINE MINI App + Messaging API (webhook signature / push messages)
      LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID:-}
      LINE_LOGIN_CHANNEL_SECRET: ${LINE_LOGIN_CHANNEL_SECRET:-}
      LINE_LOGIN_SCOPE: ${LINE_LOGIN_SCOPE:-openid profile}
      LINE_EMAIL_VERIFIED: ${LINE_EMAIL_VERIFIED:-false}
      LINE_CHANNEL_ID: ${LINE_CHANNEL_ID:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      LINE_OA_CHANNEL_SECRET: ${LINE_OA_CHANNEL_SECRET:-}
      LINE_OA_BASIC_ID: ${LINE_OA_BASIC_ID:-}
      ADMIN_LINE_USER_ID: ${ADMIN_LINE_USER_ID:-}
      LIFF_ID: ${LIFF_ID:-}
      LIFF_BASE_URL: ${LIFF_BASE_URL:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Phase 131 — hybrid web identity (Google OIDC + email magic link)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OIDC_SCOPE: ${GOOGLE_OIDC_SCOPE:-openid email profile}
      WEB_APP_URL: ${WEB_APP_URL:-}
      EMAIL_API_URL: ${EMAIL_API_URL:-}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@ebook.local}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Ebook Platform}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      omni-network:
        ipv4_address: 172.28.0.20

  # -----------------------------------------------------------------
  # Frontend Next.js 15 Standalone Service
  # -----------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        # Baked into the client bundle at build time (see Dockerfile ARGs).
        NEXT_PUBLIC_DEFAULT_LIFF_ID: ${NEXT_PUBLIC_DEFAULT_LIFF_ID:-}
        NEXT_PUBLIC_LIFF_ID: ${NEXT_PUBLIC_LIFF_ID:-}
        NEXT_PUBLIC_LINE_LIFF_ID: ${NEXT_PUBLIC_LINE_LIFF_ID:-}
        NEXT_PUBLIC_LIFF_URL_BASE: ${NEXT_PUBLIC_LIFF_URL_BASE:-}
        NEXT_PUBLIC_LINE_OA_URL: ${NEXT_PUBLIC_LINE_OA_URL:-}
        NEXT_PUBLIC_BASE_DOMAIN: ${NEXT_PUBLIC_BASE_DOMAIN:-}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-}
    container_name: omni-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001
      BACKEND_URL: http://backend:3000
      # Phase 131: pinned public origin for OAuth redirect URIs (empty = request origin).
      WEB_APP_URL: ${WEB_APP_URL:-}
      # Middleware verifies the session cookie with the same secret as the backend.
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-for-local-dev-12345}
      # Server-rendered LIFF/branding values (client bundle values are baked at build).
      NEXT_PUBLIC_DEFAULT_LIFF_ID: ${NEXT_PUBLIC_DEFAULT_LIFF_ID:-}
      NEXT_PUBLIC_LIFF_ID: ${NEXT_PUBLIC_LIFF_ID:-}
      NEXT_PUBLIC_LINE_LIFF_ID: ${NEXT_PUBLIC_LINE_LIFF_ID:-}
      NEXT_PUBLIC_LIFF_URL_BASE: ${NEXT_PUBLIC_LIFF_URL_BASE:-}
      NEXT_PUBLIC_LINE_OA_URL: ${NEXT_PUBLIC_LINE_OA_URL:-}
      NEXT_PUBLIC_BASE_DOMAIN: ${NEXT_PUBLIC_BASE_DOMAIN:-}
    depends_on:
      - backend
    networks:
      omni-network:
        ipv4_address: 172.28.0.21
