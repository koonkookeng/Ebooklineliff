networks:
  omni-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_node1_data: {}
  redis_node2_data: {}
  redis_node3_data: {}
  redis_node4_data: {}
  redis_node5_data: {}
  redis_node6_data: {}

services:
  # -----------------------------------------------------------------
  # Primary Database: PostgreSQL 16 with pgvector Extension
  # -----------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: omni-postgres-16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omni_db}
      POSTGRES_USER: ${POSTGRES_USER:-omni_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecurePass144XZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/backend/src/infra/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./apps/backend/src/infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    ports:
      - "5432:5432"
    networks:
      omni-network:
        ipv4_address: 172.28.0.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omni_admin} -d ${POSTGRES_DB:-omni_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: postgres -c config_file=/etc/postgresql/postgresql.conf

  # -----------------------------------------------------------------
  # Redis 7.2 Cluster Setup (3 Masters, 3 Replicas)
  # -----------------------------------------------------------------
  redis-node-1:
    image: redis:7.2-alpine
    container_name: omni-redis-1
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass ${REDIS_PASSWORD:-RedisSecure144XZ} --masterauth ${REDIS_PASSWORD:-RedisSecure144XZ} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_node1_data:/data
    networks:
      omni-network:
        ipv4_address: 172.28.0.11
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisSecure144XZ}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-node-2:
    image: redis:7.2-alpine
    container_name: omni-redis-2
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass ${REDIS_PASSWORD:-RedisSecure144XZ} --masterauth ${REDIS_PASSWORD:-RedisSecure144XZ} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_node2_data:/data
    networks:
      omni-network:
        ipv4_address: 172.28.0.12

  redis-node-3:
    image: redis:7.2-alpine
    container_name: omni-redis-3
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass ${REDIS_PASSWORD:-RedisSecure144XZ} --masterauth ${REDIS_PASSWORD:-RedisSecure144XZ} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_node3_data:/data
    networks:
      omni-network:
        ipv4_address: 172.28.0.13

  redis-node-4:
    image: redis:7.2-alpine
    container_name: omni-redis-4
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass ${REDIS_PASSWORD:-RedisSecure144XZ} --masterauth ${REDIS_PASSWORD:-RedisSecure144XZ} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_node4_data:/data
    networks:
      omni-network:
        ipv4_address: 172.28.0.14

  redis-node-5:
    image: redis:7.2-alpine
    container_name: omni-redis-5
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass ${REDIS_PASSWORD:-RedisSecure144XZ} --masterauth ${REDIS_PASSWORD:-RedisSecure144XZ} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_node5_data:/data
    networks:
      omni-network:
        ipv4_address: 172.28.0.15

  redis-node-6:
    image: redis:7.2-alpine
    container_name: omni-redis-6
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass ${REDIS_PASSWORD:-RedisSecure144XZ} --masterauth ${REDIS_PASSWORD:-RedisSecure144XZ} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_node6_data:/data
    networks:
      omni-network:
        ipv4_address: 172.28.0.16

  # Automated Cluster Creator Service
  redis-cluster-init:
    image: redis:7.2-alpine
    container_name: omni-redis-cluster-init
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
      - redis-node-4
      - redis-node-5
      - redis-node-6
    networks:
      - omni-network
    command: >
      sh -c "sleep 5 &&
      echo 'yes' | redis-cli -a ${REDIS_PASSWORD:-RedisSecure144XZ} --cluster create 172.28.0.11:6379 172.28.0.12:6379 172.28.0.13:6379 172.28.0.14:6379 172.28.0.15:6379 172.28.0.16:6379 --cluster-replicas 1"
