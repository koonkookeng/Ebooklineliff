services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ebook
      POSTGRES_PASSWORD: ebook
      POSTGRES_DB: ebook_liff
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7.2
    ports:
      - "6379:6379"
volumes:
  pgdata: {}
